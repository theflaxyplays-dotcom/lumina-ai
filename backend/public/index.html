<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumina AI Assistant</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-hidden">
  
  <!-- Header -->
  <header class="p-4 border-b border-cyan-500/20 flex justify-between items-center backdrop-blur-md bg-slate-900/60 z-20">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
      <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">LUMINA AI</h1>
    </div>
    <div class="flex items-center space-x-2 text-xs">
      <span class="px-2 py-1 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Maya Mode</span>
      <span class="px-2 py-1 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30" id="nativeStatus">Live Cloud</span>
    </div>
  </header>

  <!-- Glowing Voice Orb Centerpiece -->
  <div class="flex-1 flex flex-col items-center justify-center relative p-4">
    <div id="orb" onclick="handleOrbClick()" class="w-44 h-44 rounded-full bg-gradient-to-tr from-cyan-500 via-indigo-600 to-fuchsia-500 blur-sm shadow-[0_0_80px_rgba(6,182,212,0.6)] flex items-center justify-center transition-all duration-300 cursor-pointer animate-pulse">
      <div class="w-36 h-36 rounded-full bg-slate-950 flex flex-col items-center justify-center text-center p-2">
        <svg class="w-10 h-10 text-cyan-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        <span id="statusText" class="text-xs text-slate-400 font-medium">"Wake up Lumina"</span>
      </div>
    </div>
  </div>

  <!-- Chat Log / Messages -->
  <div id="chatLog" class="h-48 overflow-y-auto px-4 space-y-3 pb-2 text-sm z-10"></div>

  <!-- Input Bar -->
  <footer class="p-3 bg-slate-900/80 border-t border-cyan-500/20 flex items-center space-x-2 z-20">
    <input type="text" id="userInput" onkeydown="if(event.key==='Enter') handleSend()" placeholder="Type a message or command..." class="flex-1 bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 text-slate-200">
    <button id="sendBtn" onclick="handleSend()" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold px-4 py-3 rounded-xl transition-all flex items-center justify-center">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
    </button>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
